<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faceShade" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#fdd9b5"/>
      <stop offset="100%" stop-color="#f0b896"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#ede8f5"/>
      <stop offset="100%" stop-color="#d5cceb"/>
    </radialGradient>
    <radialGradient id="hairShine" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#3b2213"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Head group with shadow -->
  <g filter="url(#shadow)">

    <!-- Hair back layer -->
    <ellipse cx="32" cy="28" rx="18" ry="19" fill="#3b2213"/>

    <!-- Hair top / bangs - thick layered look -->
    <ellipse cx="32" cy="18" rx="17" ry="12" fill="#4a2d1a"/>
    <ellipse cx="24" cy="16" rx="9" ry="8" fill="#3b2213"/>
    <ellipse cx="40" cy="16" rx="9" ry="8" fill="#3b2213"/>
    <ellipse cx="32" cy="13" rx="12" ry="8" fill="url(#hairShine)"/>
    <!-- Side hair -->
    <ellipse cx="16" cy="26" rx="5" ry="10" fill="#3b2213"/>
    <ellipse cx="48" cy="26" rx="5" ry="10" fill="#3b2213"/>
    <!-- Hair strands for layered effect -->
    <path d="M18 14 Q24 8 32 10 Q40 8 46 14 Q44 6 32 5 Q20 6 18 14Z" fill="#4a2d1a"/>
    <path d="M20 12 Q26 6 32 7 Q38 6 44 12 Q40 5 32 4 Q24 5 20 12Z" fill="#5a3a22" opacity="0.7"/>

    <!-- Face -->
    <ellipse cx="32" cy="34" rx="14" ry="14.5" fill="url(#faceShade)"/>
    <!-- Subtle chin shading -->
    <ellipse cx="32" cy="40" rx="10" ry="6" fill="#f0b896" opacity="0.4"/>

    <!-- Eyes -->
    <ellipse cx="26" cy="33" rx="2.2" ry="2.8" fill="#2d2013"/>
    <ellipse cx="38" cy="33" rx="2.2" ry="2.8" fill="#2d2013"/>
    <!-- Eye highlights -->
    <circle cx="27" cy="32" r="0.9" fill="#fff"/>
    <circle cx="39" cy="32" r="0.9" fill="#fff"/>

    <!-- Tiny mouth - simple curved line -->
    <path d="M29 38 Q32 40.5 35 38" stroke="#c4846a" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Pink blush cheeks -->
    <ellipse cx="21" cy="37" rx="3.5" ry="2.2" fill="#f5a0b8" opacity="0.55"/>
    <ellipse cx="43" cy="37" rx="3.5" ry="2.2" fill="#f5a0b8" opacity="0.55"/>

  </g>
</svg>
